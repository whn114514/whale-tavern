<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0b0d"><title>Whale Roulette — 鲸渊轮盘</title><style>
:root{--gold:#c9a878;--muted:#a49a8d;--red:#bd4e43;--bg:#090a0b}*{box-sizing:border-box}body{margin:0;background:#050506;color:#eee5d6;font-family:Georgia,'Songti SC',serif;overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.3;cursor:not-allowed}.stage{min-height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 8%,#463322 0%,#1d1b19 24%,#0a0b0c 72%)}.stage:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(0deg,transparent 0 3px,#000 4px 5px);z-index:9}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,#000c 100%);z-index:8}.lamp{position:absolute;left:50%;top:-75px;transform:translateX(-50%);height:210px;width:290px;border-radius:50%;background:radial-gradient(ellipse,#e6a14c44,transparent 65%);filter:blur(16px);animation:flicker 4s infinite}@keyframes flicker{0%,100%{opacity:.9}43%{opacity:.65}45%{opacity:1}47%{opacity:.72}68%{opacity:.9}}.hanging{position:absolute;left:50%;top:0;transform:translateX(-50%);width:2px;height:60px;background:#63594a}.hanging:after{content:'';position:absolute;top:58px;left:-33px;width:68px;height:27px;border-radius:4px 4px 45px 45px;background:linear-gradient(#8a7045,#32271e);box-shadow:0 20px 65px 24px #c68a3844}.back{position:absolute;top:13%;left:0;right:0;display:flex;justify-content:space-around;opacity:.5}.window{width:18%;height:170px;border:10px solid #221e1a;border-radius:60px 60px 3px 3px;background:linear-gradient(130deg,#253039,#080c0e);box-shadow:inset 0 0 30px #000,0 0 10px #000}.window:after{content:'';display:block;margin:0 auto;width:8px;height:100%;background:#211e1b}.brand{text-align:center;position:relative;z-index:3;padding-top:24px;letter-spacing:5px;color:var(--gold);font-size:clamp(21px,4vw,38px);text-shadow:0 2px 15px #000}.subtitle{text-align:center;letter-spacing:4px;color:#a6a09a;font-size:11px;margin-top:6px;position:relative;z-index:3}.dealer{position:relative;z-index:2;margin:35px auto -12px;width:180px;height:210px;filter:drop-shadow(0 10px 15px #000);animation:breathe 5s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(3px)}}.head{position:absolute;top:10px;left:47px;width:86px;height:105px;border-radius:44% 44% 38% 38%;background:linear-gradient(100deg,#282e2e,#111617 65%);box-shadow:inset -13px 0 20px #000,0 0 22px #181a1a}.hat{position:absolute;top:-2px;left:34px;width:110px;height:34px;background:#101213;border-radius:50%;box-shadow:0 -20px 0 -4px #15191a}.eyes{position:absolute;top:57px;left:66px;display:flex;gap:28px}.eye{width:9px;height:5px;border-radius:50%;background:#d0a468;box-shadow:0 0 12px #e3a44d}.torso{position:absolute;top:105px;left:12px;width:156px;height:105px;background:linear-gradient(95deg,#111619,#303332 50%,#0c1012);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);border-radius:30px}.tie{position:absolute;top:114px;left:83px;width:13px;height:68px;background:#622a25;clip-path:polygon(50% 0,100% 20%,65% 100%,30% 100%,0 20%)}.table{position:relative;z-index:3;margin:0 auto;width:min(940px,98vw);min-height:390px;padding:35px 25px 24px;background:radial-gradient(ellipse at 50% 15%,#4d382c,#2d211c 65%,#160f0d);border:14px solid #18110e;border-radius:50% 50% 20% 20%/26% 26% 13% 13%;box-shadow:inset 0 0 0 4px #6b4c30,inset 0 20px 45px #0009,0 25px 55px #000;display:flex;flex-direction:column;align-items:center;gap:12px}.hud{display:flex;justify-content:space-between;width:min(700px,95%);gap:15px;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:1px}.hp{color:#cbbbaa}.pips{display:flex;gap:6px;margin-top:7px}.pip{height:10px;width:25px;border:1px solid #9e6e5a;background:#9b3e36;box-shadow:0 0 8px #7a241d55}.pip.empty{background:#171414}.status{min-height:38px;text-align:center;font-size:clamp(14px,2.3vw,20px);color:#e5d2b5;text-shadow:0 2px 4px #000}.shells{display:flex;gap:7px;align-items:center;justify-content:center;min-height:30px}.shell{height:27px;width:12px;border-radius:3px 3px 5px 5px;border:1px solid #8d6c3c;background:linear-gradient(90deg,#7b542c,#dfbc72,#684822)}.shell.live{background:linear-gradient(90deg,#752923,#e67a61,#6a231e)}.gun{width:190px;height:75px;position:relative;margin:0 auto;transform:rotate(-7deg);filter:drop-shadow(3px 10px 5px #0009)}.barrel{position:absolute;left:30px;top:18px;width:155px;height:19px;background:linear-gradient(#545858,#15191b 50%,#53595a);border-radius:4px}.stock{position:absolute;left:12px;top:25px;width:78px;height:40px;background:linear-gradient(#765039,#332218);clip-path:polygon(0 0,100% 0,65% 45%,40% 100%,0 100%);border-radius:5px}.trigger{position:absolute;left:83px;top:34px;width:30px;height:24px;border:5px solid #303132;border-radius:50%}.inventory{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.item{background:#1b1918;border:1px solid #6b5945;color:#e5d4b7;border-radius:6px;padding:8px 10px;font-size:12px;min-width:80px}.item.selected{border-color:#f0cc82;box-shadow:0 0 12px #d7a24c88}.controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;position:relative;z-index:5;padding:16px 12px 28px}.action{background:linear-gradient(#47372a,#211b17);border:1px solid #98744c;color:#ead5b3;padding:13px 18px;border-radius:5px;min-width:135px;font-weight:bold;letter-spacing:1px}.action.danger{border-color:#ae5245;background:linear-gradient(#612e2b,#2d1818)}.action:hover:not(:disabled){filter:brightness(1.2)}.log{position:relative;z-index:5;margin:0 auto 25px;width:min(780px,95%);height:100px;overflow:auto;padding:10px 16px;background:#070707a8;border:1px solid #564333;color:#aa9d8c;font:12px/1.8 system-ui,sans-serif;border-radius:5px}.overlay{position:fixed;inset:0;background:#000d;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.panel{width:min(500px,100%);background:linear-gradient(135deg,#27211e,#100f10);border:1px solid #a08055;box-shadow:0 0 80px #000;padding:30px;text-align:center;border-radius:8px}.panel h2{font-size:30px;letter-spacing:3px;color:#d3b486}.panel p{font:14px/1.8 system-ui,sans-serif;color:#b9afa3}.panel button{margin:7px}.hide{display:none!important}.flash{position:fixed;inset:0;background:#f6e9c8;z-index:30;pointer-events:none;animation:flash .45s forwards}@keyframes flash{to{opacity:0}}.shake{animation:shake .3s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@media(max-width:600px){.dealer{margin-top:18px;transform:scale(.82);transform-origin:bottom center;margin-bottom:-25px}.table{min-height:350px;padding:28px 10px 15px;border-width:9px}.hud{font-size:11px}.pip{width:18px}.action{min-width:115px;padding:12px 10px}.brand{padding-top:18px}.window{height:115px}}
</style></head><body><main class="stage" id="stage"><div class="lamp"></div><div class="hanging"></div><div class="back"><div class="window"></div><div class="window"></div><div class="window"></div></div><div class="vignette"></div><div class="brand">WHALE ROULETTE</div><div class="subtitle">鲸 渊 轮 盘 · THE LAST CHAMBER</div><div class="dealer"><div class="torso"></div><div class="tie"></div><div class="head"></div><div class="hat"></div><div class="eyes"><div class="eye"></div><div class="eye"></div></div></div><section class="table"><div class="hud"><div class="hp">你 · <span id="ph">4</span> HP<div class="pips" id="pp"></div></div><div style="text-align:center;color:#d0b184">第 <span id="round">1</span> 膛<br><span id="turnlabel">等待开始</span></div><div class="hp" style="text-align:right">庄家 · <span id="dh">4</span> HP<div class="pips" id="dp"></div></div></div><div class="status" id="status">你愿意用命运交换答案吗？</div><div class="shells" id="shells"></div><div class="gun"><div class="stock"></div><div class="barrel"></div><div class="trigger"></div></div><div style="font:12px system-ui;color:#b3a08c">你的道具（点击使用）</div><div class="inventory" id="inventory"></div></section><div class="controls"><button class="action danger" id="shootDealer">瞄准庄家</button><button class="action" id="shootSelf">瞄准自己</button><button class="action" id="sound">🔊 音效：开</button></div><div class="log" id="log" aria-live="polite"></div></main><div class="overlay" id="intro"><div class="panel"><h2>鲸 渊 轮 盘</h2><p>一张桌子，一位不知来历的庄家。<br>每轮装入实弹与空包弹，顺序保密。<br>射中对手造成 1 点伤害；对自己打出空包弹可继续行动。<br>道具：放大镜查看当前弹；啤酒弹出当前弹；手铐让对方跳过一次行动；香烟恢复 1 点生命。<br>这是纯虚构的策略游戏。</p><button class="action" id="start">开始对局</button></div></div><div class="overlay hide" id="end"><div class="panel"><h2 id="endTitle">对局结束</h2><p id="endText"></p><button class="action" id="again">再来一局</button></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let S=null,audio=null,soundOn=true,busy=false;const ITEMS=['放大镜','啤酒','手铐','香烟'];const sleep=t=>new Promise(r=>setTimeout(r,t));const pick=a=>a[Math.floor(Math.random()*a.length)];function beep(f=160,d=.15,type='sine',vol=.08){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.5),audio.currentTime+d);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function say(t){const p=document.createElement('div');p.textContent='› '+t;$('log').prepend(p);$('status').textContent=t}function render(){if(!S)return;$('ph').textContent=S.hp[0];$('dh').textContent=S.hp[1];for(let i=0;i<2;i++)$(i?'dp':'pp').innerHTML=Array.from({length:4},(_,j)=>`<span class="pip ${j>=S.hp[i]?'empty':''}"></span>`).join('');$('round').textContent=S.round;$('turnlabel').textContent=S.turn===0?'你的回合':'庄家回合';$('shells').innerHTML=S.chamber.map((_,i)=>`<span class="shell" style="opacity:${i===0?1:.45}" title="未揭晓"></span>`).join('');$('inventory').innerHTML='';S.items[0].forEach((name,i)=>{let b=document.createElement('button');b.className='item';b.textContent=name;b.disabled=busy||S.turn!==0;b.onclick=()=>useItem(0,i);$('inventory').append(b)});$('shootDealer').disabled=$('shootSelf').disabled=busy||S.turn!==0||S.hp.some(x=>x<=0)}function newRound(){S.round++;const n=4+Math.floor(Math.random()*4),live=1+Math.floor(Math.random()*(n-1));S.chamber=Array.from({length:n},(_,i)=>i<live?1:0);for(let i=S.chamber.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[S.chamber[i],S.chamber[j]]=[S.chamber[j],S.chamber[i]]}S.known=[null,null];S.skip=[false,false];for(let p=0;p<2;p++){while(S.items[p].length<Math.min(4,2+Math.floor(S.round/3)))S.items[p].push(pick(ITEMS))}say(`新弹膛：${n} 发，${live} 发实弹，${n-live} 发空包弹。顺序未知。`);beep(230,.25);render()}function start(){S={hp:[4,4],items:[[],[]],round:0,turn:0,chamber:[],known:[null,null],skip:[false,false]};busy=false;$('intro').classList.add('hide');$('end').classList.add('hide');$('log').innerHTML='';newRound()}function done(){if(S.hp[0]>0&&S.hp[1]>0)return false;busy=true;$('endTitle').textContent=S.hp[0]>0?'你活到了黎明':'庄家赢了';$('endText').textContent=S.hp[0]>0?'桌上的最后一声枪响之后，酒馆重归寂静。':'黑暗中传来杯子轻碰桌面的声音。';$('end').classList.remove('hide');render();return true}async function shoot(target){if(!S||busy||S.turn!==0)return;await fire(0,target)}async function fire(who,target){busy=true;render();say(`${who===0?'你':'庄家'}将枪口对准${target===0?'自己':'对手'}……`);beep(110,.3,'sawtooth',.04);await sleep(850);const live=S.chamber.shift();S.known=[null,null];if(live){S.hp[target]=Math.max(0,S.hp[target]-1);$('stage').classList.add('shake');const f=document.createElement('div');f.className='flash';document.body.append(f);setTimeout(()=>{f.remove();$('stage').classList.remove('shake')},470);beep(90,.55,'sawtooth',.24);say(`砰！实弹。${target===0?'你':'庄家'}失去 1 点生命。`)}else{beep(430,.12,'triangle');say('咔哒……空包弹。')}await sleep(500);if(done())return;if(S.chamber.length===0){S.turn=who===target&&!live?who:1-who;newRound()}else if(target===who&&!live){S.turn=who;say('空包弹射向自己：获得额外行动。')}else{S.turn=1-who}if(S.skip[S.turn]){S.skip[S.turn]=false;say(`${S.turn===0?'你':'庄家'}被手铐限制，跳过行动。`);S.turn=1-S.turn}busy=false;render();if(S.turn===1)setTimeout(ai,850)}function useItem(who,idx){if(!S||busy||S.turn!==who||!S.chamber.length)return;const name=S.items[who][idx];if(name==='香烟'&&S.hp[who]>=4){if(who===0)say('生命已满，无需使用香烟。');return}if(name==='手铐'&&S.skip[1-who]){if(who===0)say('对方已经被手铐限制。');return}S.items[who].splice(idx,1);if(name==='放大镜'){S.known[who]=S.chamber[0];say(who===0?`放大镜：当前是${S.chamber[0]?'实弹':'空包弹'}。`:'庄家仔细检查了弹膛。')}if(name==='啤酒'){let x=S.chamber.shift();S.known=[null,null];say(`${who===0?'你':'庄家'}弹出一发${x?'实弹':'空包弹'}。`);beep(360,.18);if(!S.chamber.length){newRound()}}if(name==='手铐'){S.skip[1-who]=true;say(`${who===0?'你':'庄家'}使用手铐：对手下一次行动将跳过。`)}if(name==='香烟'){S.hp[who]++;say(`${who===0?'你':'庄家'}恢复了 1 点生命。`)}render()}async function ai(){if(!S||S.turn!==1||busy||done())return;busy=true;render();await sleep(700);let itemIndex=S.items[1].indexOf('香烟');if(S.hp[1]<4&&itemIndex>=0){busy=false;useItem(1,itemIndex);busy=true;await sleep(450)}itemIndex=S.items[1].indexOf('放大镜');if(itemIndex>=0&&S.known[1]===null&&Math.random()<.7){busy=false;useItem(1,itemIndex);busy=true;await sleep(450)}itemIndex=S.items[1].indexOf('手铐');if(itemIndex>=0&&!S.skip[0]&&Math.random()<.5){busy=false;useItem(1,itemIndex);busy=true;await sleep(450)}if(S.turn!==1){busy=false;return}let target;if(S.known[1]!==null)target=S.known[1]?0:1;else{let live=S.chamber.filter(x=>x===1).length;target=Math.random()<Math.max(.13,1-live/S.chamber.length)*.65?1:0}busy=false;await fire(1,target)}$('shootDealer').onclick=()=>shoot(1);$('shootSelf').onclick=()=>shoot(0);$('start').onclick=start;$('again').onclick=start;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 音效：开':'🔇 音效：关';if(soundOn)beep(300,.1)};window.addEventListener('keydown',e=>{if(e.key==='1')shoot(1);if(e.key==='2')shoot(0)});})();
</script></body></html>
