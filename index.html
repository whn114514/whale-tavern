</style></head><body><div id="scene"></div><div id="vignette"></div>
<div id="menu" class="panel"><div class="sub">A GAME OF BLUFF & FATE</div><h1>WHALE TAVERN</h1><div class="sub" style="margin-bottom:16px">鲸 鱼 酒 馆 · P2P V2</div><input id="name" maxlength="16" placeholder="你的昵称" value="旅行者"><button style="width:100%;margin:7px 0" onclick="create(3)">单人游戏 · 3 名 AI</button><button style="width:100%;margin:7px 0" class="secondary" onclick="create(0)">创建 P2P 房间（iPad / Mac）</button><button style="width:100%;margin:7px 0" class="secondary" onclick="openJoin()">加入朋友的房间</button><p class="small">无需 Python、无需部署服务器。通过复制连接信息建立 WebRTC 连接；两台设备需要能访问本网页。</p><p id="connection" class="small">离线单人模式可用 · P2P 使用公共 STUN（可能无法穿透部分网络）</p></div>

<div id="top" class="hidden"><div class="panel"><div style="font-size:11px;color:#a69a90">房间代码</div><div id="roomcode">------</div></div><div id="status" class="panel">等待玩家</div></div><div id="players" class="hidden"></div><div id="log" class="hidden"></div>

<script type="module">
let scene,camera,renderer,actors=[],table,cardStack;const mount=document.getElementById('scene');
try{const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');scene=new THREE.Scene();scene.background=new THREE.Color('#140f16');scene.fog=new THREE.Fog('#140f16',9,23);camera=new THREE.PerspectiveCamera(49,innerWidth/innerHeight,.1,100);camera.position.set(0,4.1,8.8);camera.lookAt(0,1.1,0);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;mount.appendChild(renderer.domElement);

box(35,.2,35,floor,0,-.18,0);box(35,14,.3,wall,0,6,-9);for(let x=-10;x<=10;x+=4){box(.22,8,.3,wood,x,3,-8.8);box(.12,7,.12,gold,x,3,-8.55)}for(let x=-10;x<=10;x+=3){box(.09,.08,16,wood,x,-.03,-1)}

for(let i=0;i<4;i++){let a=i*Math.PI/2+Math.PI/4;let x=Math.sin(a)*3.2,z=Math.cos(a)*3.2;let group=new THREE.Group();group.position.set(x,0,z);group.rotation.y=a+Math.PI;scene.add(group);let colors=['#6a3c39','#3c5363','#5e4c67','#69603b'];let coat=new THREE.Mesh(new THREE.CylinderGeometry(.44,.6,1.2,12),mat(colors[i]));coat.position.y=1.25;group.add(coat);let head=new THREE.Mesh(new THREE.SphereGeometry(.37,18,16),mat(['#a77a62','#777e8c','#8d7766','#b5a07d'][i]));head.position.y=2.08;group.add(head);let hat=new THREE.Mesh(new THREE.CylinderGeometry(.39,.42,.2,18),mat('#1b1920'));hat.position.y=2.42;group.add(hat);let brim=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.04,18),mat('#1b1920'));brim.position.y=2.3;group.add(brim);for(let s of [-1,1]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.042,8,8),mat('#e9c48a'));eye.position.set(s*.13,2.11,.34);group.add(eye)}actors.push(group)}

}catch(e){console.warn('3D 模型加载失败，游戏 UI 仍可使用',e);document.getElementById('hint').textContent='3D 场景需要互联网加载 Three.js；游戏规则仍可使用。'}
