<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101828"><title>Whale Crash — 鲸鱼撞撞车</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef3ff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#app{height:100dvh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#141e30;gap:10px}header strong{font-size:17px}button{border:0;border-radius:12px;background:#294362;color:white;padding:10px 15px;font-weight:750;cursor:pointer;touch-action:none}button.primary{background:#ffba48;color:#172034}button:disabled{opacity:.4}#arena{position:relative;flex:1;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}#overlay{position:absolute;inset:0;background:#08101ddf;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}#panel{max-width:820px;width:100%;background:#18263b;border:1px solid #41526b;border-radius:20px;padding:18px;box-shadow:0 20px 80px #0008}h1{margin:0 0 4px;font-size:clamp(24px,5vw,36px)}p{color:#c7d4e8;margin:6px 0 14px}.cars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:12px 0}.car{background:#24354e;border:2px solid transparent;min-height:115px;padding:10px 5px}.car.selected{border-color:#ffcf6d;background:#3c4254}.car .emoji{display:block;font-size:32px}.car small{display:block;font-weight:400;color:#b9c9dc;margin-top:4px}#controls{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#141e30;gap:8px;user-select:none}#controls .group{display:flex;gap:10px}#controls button{font-size:22px;min-width:74px;min-height:52px;background:#354e72}#controls .jump{background:#d97b32}#score{font-size:17px;font-weight:800;text-align:center}#hint{font-size:11px;color:#adbed2;text-align:center}#status{font-size:12px;color:#b4c6dd}#start{width:100%;font-size:18px;padding:13px}.hidden{display:none!important}@media(max-width:600px){.cars{grid-template-columns:repeat(2,1fr)}#panel{padding:12px}.car{min-height:90px}#controls button{min-width:60px;min-height:50px}header strong{font-size:14px}#status{display:none}}</style></head><body><div id="app"><header><strong>🐋 WHALE CRASH</strong><div id="score">你 0 : 0 AI</div><button id="menu">选车 / 重开</button></header><div id="arena"><canvas id="game"></canvas><div id="overlay"><div id="panel"><h1>鲸鱼撞撞车 🏁</h1><p>撞击对手的驾驶员头部，率先拿下 5 分！8 款不同性能的车辆可选。</p><div class="cars" id="cars"></div><p id="chosen"></p><button class="primary" id="start">驾驶这辆车 · 开始比赛</button><p style="font-size:12px;margin-top:10px">iPad：底部按钮控制。Mac：A / D 或 ← / → 驾驶，W / ↑ / 空格跳跃。可在空中调整车身。</p></div></div></div><div id="controls"><div class="group"><button data-key="left" aria-label="向左">◀</button><button data-key="right" aria-label="向右">▶</button></div><div><div id="hint">先撞到对手头部获胜</div><div id="status">准备比赛</div></div><div class="group"><button class="jump" data-key="jump" aria-label="跳跃">⤒</button></div></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),carsEl=document.getElementById('cars'),chosen=document.getElementById('chosen'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');const TYPES=[['小轿车','🚗','#ff645f',1,1,1],['越野车','🚙','#5db9f0',1.16,.85,1.12],['赛车','🏎️','#ffd25b',.82,1.5,.8],['卡车','🚚','#9bd17c',1.42,.68,1.18],['警车','🚓','#b8d8ff',1.05,1.15,1],['怪兽车','🛻','#cb89f7',1.6,.83,1.35],['迷你车','🚕','#ffb44c',.65,1.35,.72],['装甲车','🚜','#aaaebc',1.8,.65,1.25]];let selected=0,running=false,freeze=0,points=[0,0],player,enemy,keys={left:false,right:false,jump:false},last=0,worldW=960,worldH=540,particles=[],shake=0,round=0,gameOver=false;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function renderCars(){carsEl.innerHTML='';TYPES.forEach((t,i)=>{let b=document.createElement('button');b.className='car'+(selected===i?' selected':'');b.innerHTML='<span class="emoji">'+t[1]+'</span>'+t[0]+'<small>重量 '+Math.round(t[3]*10)+' · 速度 '+Math.round(t[4]*10)+'</small>';b.onclick=()=>{selected=i;renderCars()};carsEl.append(b)});chosen.textContent='当前车辆：'+TYPES[selected][0]+' · 不同重量、速度、轮胎尺寸'}function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(r.width*d));canvas.height=Math.max(1,Math.floor(r.height*d))}addEventListener('resize',resize);resize();function makeCar(type,x,side){let t=TYPES[type];return {type,x,y:375,vx:0,vy:0,ang:0,av:0,dir:side,ground:false,jumpReady:true,mass:t[3],speed:t[4],scale:t[5],color:t[2],ai:side===-1,decision:0}}function resetRound(){player=makeCar(selected,225,1);enemy=makeCar(Math.floor(rand(0,TYPES.length)),735,-1);freeze=1.3;round++;statusEl.textContent='第 '+round+' 回合 · 准备！';particles=[]}function start(){points=[0,0];round=0;gameOver=false;scoreEl.textContent='你 0 : 0 AI';running=true;overlay.classList.add('hidden');resetRound();last=performance.now()}document.getElementById('start').onclick=start;document.getElementById('menu').onclick=()=>{running=false;overlay.classList.remove('hidden');renderCars()};renderCars();function platformY(x){if(x<85||x>875)return 445;if(x>405&&x<555)return 480;return 420}function sparks(x,y,color,n=14){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-190,190),vy:rand(-240,20),life:rand(.25,.75),color})}function point(who){if(freeze>0||gameOver)return;points[who]++;scoreEl.textContent='你 '+points[0]+' : '+points[1]+' AI';shake=14;sparks((player.x+enemy.x)/2,(player.y+enemy.y)/2,'#ffd16a',35);if(points[who]>=5){gameOver=true;running=false;overlay.classList.remove('hidden');document.querySelector('#panel h1').textContent=who===0?'🏆 你赢了！':'💥 AI 获胜';document.querySelector('#panel p').textContent='最终比分 '+points[0]+' : '+points[1]+' · 换一辆车再来一局吧！';document.getElementById('start').textContent='重新开始';statusEl.textContent='比赛结束'}else{freeze=2.2;statusEl.textContent=who===0?'漂亮！你获得 1 分':'被撞中头部！AI 获得 1 分';setTimeout(()=>{if(running&&freeze<=.05)resetRound()},2250)}}function updateCar(c,dt,left,right,jump){const accel=780*c.speed/c.mass;let force=(right?1:0)-(left?1:0);c.vx+=force*accel*dt;c.vx*=Math.pow(c.ground?.89:.985,dt*60);c.vx=clamp(c.vx,-350*c.speed,350*c.speed);if(c.ground){c.av+=force*.65*dt;c.av*=.72}else{c.av+=force*2.6*dt;c.av*=.992}c.ang+=c.av*dt;c.ang=clamp(c.ang,-Math.PI*2,Math.PI*2);if(jump&&c.ground&&c.jumpReady){c.vy=-400/c.mass**.25;c.ground=false;c.jumpReady=false;sparks(c.x,c.y+20,'#c7b39a',7)}if(!jump)c.jumpReady=true;c.vy+=950*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;let floor=platformY(c.x)-25*c.scale;if(c.y>floor){if(c.vy>210)sparks(c.x,floor+15,'#d9c5a0',4);c.y=floor;c.vy=0;c.ground=true;c.ang*=Math.pow(.94,dt*60)}else c.ground=false;if(c.x<30){c.x=30;c.vx=Math.abs(c.vx)*.4}if(c.x>930){c.x=930;c.vx=-Math.abs(c.vx)*.4}if(c.y>650){c.y=300;c.vy=-200}}function head(c){const s=c.scale;return {x:c.x+Math.sin(c.ang)*(-36*s),y:c.y-Math.cos(c.ang)*(38*s),r:13*s}}function collide(){let dx=player.x-enemy.x,dy=player.y-enemy.y,dist=Math.hypot(dx,dy)||1,min=56*(player.scale+enemy.scale)/2;if(dist<min){let nx=dx/dist,ny=dy/dist,push=(min-dist)*.5;player.x+=nx*push;enemy.x-=nx*push;player.y+=ny*push;enemy.y-=ny*push;let rv=(player.vx-enemy.vx)*nx+(player.vy-enemy.vy)*ny;if(rv<0){let impulse=-rv*.68;player.vx+=nx*impulse/player.mass;enemy.vx-=nx*impulse/enemy.mass;player.vy+=ny*impulse*.4;enemy.vy-=ny*impulse*.4;player.av+=rand(-2,2);enemy.av+=rand(-2,2);if(impulse>45){sparks((player.x+enemy.x)/2,(player.y+enemy.y)/2,'#ffdc83',8);shake=3}}}const a=head(player),b=head(enemy);function hit(h,attacker){let dx=h.x-attacker.x,dy=h.y-attacker.y;return Math.hypot(dx,dy)<39*attacker.scale && Math.hypot(attacker.vx,attacker.vy)>90}if(hit(b,player))point(0);else if(hit(a,enemy))point(1);else if(Math.abs(player.ang)>2.35&&player.ground&&Math.abs(player.av)>.6)point(1);else if(Math.abs(enemy.ang)>2.35&&enemy.ground&&Math.abs(enemy.av)>.6)point(0)}function update(dt){particles=particles.filter(p=>(p.life-=dt)>0);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=470*dt});shake*=.88;if(!running)return;if(freeze>0){freeze-=dt;if(freeze<=0&&statusEl.textContent.includes('准备'))statusEl.textContent='开撞！';return}let dx=player.x-enemy.x;enemy.decision-=dt;let aiRight=dx>0,aiLeft=dx<0,aiJump=Math.abs(dx)<240&&(Math.random()<.035||enemy.y>player.y+30);updateCar(player,dt,keys.left,keys.right,keys.jump);updateCar(enemy,dt,aiLeft,aiRight,aiJump);collide()}function drawCar(c){const s=c.scale;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.ang);ctx.scale(s,s);ctx.fillStyle='#121b2b';for(let x of [-27,27]){ctx.beginPath();ctx.arc(x,18,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6e8299';ctx.beginPath();ctx.arc(x,18,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#121b2b'}ctx.fillStyle=c.color;ctx.beginPath();ctx.roundRect(-49,-17,98,31,9);ctx.fill();ctx.fillStyle='#eaf4ff';ctx.beginPath();ctx.moveTo(-24,-17);ctx.lineTo(-10,-38);ctx.lineTo(24,-38);ctx.lineTo(38,-17);ctx.closePath();ctx.fill();ctx.fillStyle='#28354a';ctx.fillRect(-5,-35,3,18);ctx.fillStyle='#e8b78b';ctx.beginPath();ctx.arc(0,-38,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#243147';ctx.fillRect(-14,-49,28,8);ctx.fillStyle='#fff5c0';ctx.fillRect(c.dir===1?40:-49,-9,9,7);ctx.restore()}function draw(){const W=canvas.width,H=canvas.height;ctx.save();ctx.clearRect(0,0,W,H);const sc=Math.min(W/960,H/540),ox=(W-960*sc)/2,oy=(H-540*sc)/2;ctx.translate(ox,oy);ctx.scale(sc,sc);if(shake>1)ctx.translate(rand(-shake,shake),rand(-shake,shake));let g=ctx.createLinearGradient(0,0,0,540);g.addColorStop(0,'#142942');g.addColorStop(.65,'#25364c');g.addColorStop(1,'#111824');ctx.fillStyle=g;ctx.fillRect(0,0,960,540);ctx.fillStyle='#243b52';for(let i=0;i<11;i++){ctx.fillRect(i*103-10,120+(i%3)*20,66,210)}ctx.fillStyle='#e9c77c';ctx.beginPath();ctx.arc(775,85,35,0,Math.PI*2);ctx.fill();ctx.fillStyle='#19283d';ctx.fillRect(0,375,960,165);ctx.fillStyle='#627d80';ctx.beginPath();ctx.moveTo(0,445);ctx.lineTo(85,445);ctx.lineTo(110,420);ctx.lineTo(405,420);ctx.lineTo(430,480);ctx.lineTo(530,480);ctx.lineTo(555,420);ctx.lineTo(850,420);ctx.lineTo(875,445);ctx.lineTo(960,445);ctx.lineTo(960,540);ctx.lineTo(0,540);ctx.closePath();ctx.fill();ctx.strokeStyle='#a2b7a3';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,445);ctx.lineTo(85,445);ctx.lineTo(110,420);ctx.lineTo(405,420);ctx.lineTo(430,480);ctx.lineTo(530,480);ctx.lineTo(555,420);ctx.lineTo(850,420);ctx.lineTo(875,445);ctx.lineTo(960,445);ctx.stroke();if(player)drawCar(player);if(enemy)drawCar(enemy);particles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,5,5)});ctx.globalAlpha=1;ctx.fillStyle='#dce8fa';ctx.font='bold 18px system-ui';ctx.fillText('你',player?player.x-10:200,player?player.y-85:200);ctx.fillText('AI',enemy?enemy.x-10:740,enemy?enemy.y-85:200);if(freeze>0&&running){ctx.font='bold 32px system-ui';ctx.textAlign='center';ctx.fillText(freeze>1?'准备碰撞！':'开始！',480,110);ctx.textAlign='left'}ctx.restore()}function loop(now){let dt=Math.min((now-last)/1000||0,.033);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump'};addEventListener('keydown',e=>{let k=map[e.code];if(k){keys[k]=true;e.preventDefault()}});addEventListener('keyup',e=>{let k=map[e.code];if(k){keys[k]=false;e.preventDefault()}});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});addEventListener('blur',()=>{keys={left:false,right:false,jump:false}});
})();</script></body></html>
